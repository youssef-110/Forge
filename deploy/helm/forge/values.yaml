image:
  repository: ghcr.io/youssef-110/forge-queue
  tag: latest
  pullPolicy: IfNotPresent

api:
  # More than one replica is safe: only the lease holder runs the scheduler.
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

worker:
  replicas: 2
  concurrency: 4
  metricsPort: 9090
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }
  autoscaling:
    enabled: false # needs metrics-server
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

config:
  visibilityTimeout: 30s
  backoffBase: 1s
  backoffCap: 60s
  readyTarget: "8"
  otlpEndpoint: "" # e.g. http://jaeger-collector.observability:4318

redis:
  # In-cluster Redis for demos. Set enabled=false and externalUrl for a managed Redis.
  enabled: true
  image: redis:7.4-alpine
  externalUrl: ""
