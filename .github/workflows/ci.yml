name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  queue:
    name: queue (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: queue } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: queue/go.mod
          cache-dependency-path: queue/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  search:
    name: search (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: search } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: search/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  agent:
    name: agent (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/forge

  # Deploy the chart to a throwaway 3-node kind cluster and push a real job through it.
  kind-e2e:
    needs: [queue, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: forge
          config: deploy/kind/kind-config.yaml
      - run: bash deploy/kind/up.sh
      - if: failure()
        run: kubectl -n forge get pods -o wide && kubectl -n forge logs -l app.kubernetes.io/instance=forge --all-containers --tail=100 --prefix

  images:
    needs: [queue, search, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: forge-queue, context: queue, file: queue/Dockerfile }
          - { name: forge-search, context: ., file: search/Dockerfile }
          - { name: forge-agent, context: agent, file: agent/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
