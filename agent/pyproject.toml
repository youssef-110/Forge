[project]
name = "forge-agent"
version = "0.1.0"
description = "MCP server + LangGraph agent + eval harness for the Forge job queue"
requires-python = ">=3.11"
# Versions verified by installing and inspecting the APIs used here.
dependencies = [
  "mcp==1.30.0",
  "httpx==0.28.1",
  "langgraph==1.2.18",
  "langchain==1.4.7",
  "langchain-core==1.7.0",
  "langchain-mcp-adapters==0.3.2",
  "langchain-groq==1.1.3",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
langfuse = ["langfuse==5.0.4"]
plot = ["matplotlib"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1"]

[tool.setuptools]
packages = ["forge_agent", "evals"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
